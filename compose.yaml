services:
  gym-management-api:
    build: .
    image: gym-management-api:local
    ports:
      - "8088:5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
